# general
dataset: new_Women
model: SASRec

# general
gpu_id: 2
use_gpu: True
seed: 101
state: INFO
reproducibility: True
data_path: 'dataset/'
checkpoint_dir: 'saved'
show_progress: True
save_dataset: False
save_dataloaders: False
log_wandb: False
wandb_project: 'new_Women'

# dataset
additional_feat_suffix: [itememb_image, itememb_text]
load_col:
    inter: [user_id, item_id, rating, timestamp]
    item: ['item_id','title','sales_rank','price','brand','categories','sales_type']
    itememb_image: [itemid_image, item_image_emb]
    itememb_text: [itemid_text, item_text_emb]
alias_of_item_id: [itemid_image, itemid_text]
preload_weight: 
    itemid_image: item_image_emb
    itemid_text: item_text_emb
MAX_ITEM_LIST_LENGTH: 50
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp

# Filtering
val_interval: ~
filter_inter_by_user_or_item: True
user_inter_num_interval: "[5,inf)"
item_inter_num_interval: "[5,inf)"

# Model
n_layers: 4
n_heads: 8
hidden_size: 256
# attribute_hidden_size: [64]
attribute_hidden_size: [256, 256, 256]
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.3
hidden_act: 'gelu'
layer_norm_eps: 1e-12
initializer_range: 0.02
selected_features: ['categories']
# selected_features: ['categories', 'itemid_image', 'itemid_text']
pooling_mode: 'sum'
loss_type: 'CE'
fusion_type: 'gate'
# lamdas: [10]
lamdas: [25, 25, 25]
attribute_predictor: 'linear'

# training settings
epochs: 200
# train_batch_size: 2048
train_batch_size: 1024
learner: adam
learning_rate: 0.0001
eval_step: 2
stopping_step: 10
clip_grad_norm: ~
weight_decay: 0.0
neg_sampling:

# evaluation settings
eval_args:
  split: { 'LS': 'valid_and_test' }
  group_by: user
  order: TO
  mode: full

repeatable: True
metrics: ["Recall","NDCG"]
topk: [3,5,10,20]
valid_metric: Recall@20
valid_metric_bigger: True
eval_batch_size: 1024
loss_decimal_place: 4
metric_decimal_place: 4